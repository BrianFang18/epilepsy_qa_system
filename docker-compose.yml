# Required invocation; do not rely on the repository-root .env:
# docker compose --env-file config/compose.env.example up --build

name: epilepsy-qa

x-backend-service: &backend-service
  image: epilepsy-qa-backend:py3.11.11
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  networks:
    - app
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-app-environment: &app-environment
  ENVIRONMENT: "${ENVIRONMENT:-development}"
  HOST: "0.0.0.0"
  PORT: "8010"
  CORS_ORIGINS: "${CORS_ORIGINS:-[\"http://localhost:8080\",\"http://127.0.0.1:8080\"]}"
  ENABLE_V2_WORKFLOW: "false"
  ENABLE_ADMIN_API: "${ENABLE_ADMIN_API:-true}"
  SEED_DEMO_DATA: "false"
  MOCK_MODE: "${MOCK_MODE:-true}"
  USE_QDRANT: "${USE_QDRANT:-true}"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "${QDRANT_COLLECTION:-epilepsy_hybrid_docs}"
  POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in config/compose.env.example}"
  POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in config/compose.env.example}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config/compose.env.example}"
  DATABASE_ECHO: "false"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in config/compose.env.example}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in config/compose.env.example}"
  MINIO_SECURE: "false"
  MINIO_DOCUMENTS_BUCKET: "${MINIO_DOCUMENTS_BUCKET:-epilepsy-documents}"
  MINIO_EVALUATIONS_BUCKET: "${MINIO_EVALUATIONS_BUCKET:-epilepsy-evaluations}"
  ADMIN_BOOTSTRAP_USERNAME: "${ADMIN_BOOTSTRAP_USERNAME:?Set ADMIN_BOOTSTRAP_USERNAME in config/compose.env.example}"
  ADMIN_BOOTSTRAP_PASSWORD: "${ADMIN_BOOTSTRAP_PASSWORD:?Set ADMIN_BOOTSTRAP_PASSWORD in config/compose.env.example}"
  ADMIN_COOKIE_SECURE: "false"
  ALLOW_UNVERIFIED_MEDICAL_ADVICE: "false"

services:
  postgres:
    image: postgres:16.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in config/compose.env.example}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in config/compose.env.example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config/compose.env.example}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256m
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    networks:
      - app

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in config/compose.env.example}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in config/compose.env.example}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    networks:
      - app

  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    networks:
      - app

  migrate:
    <<: *backend-service
    command:
      - /opt/container/with-database-url
      - alembic
      - -c
      - alembic.ini
      - upgrade
      - head
    restart: "no"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 128

  api:
    <<: *backend-service
    command:
      - /opt/container/with-database-url
      - /opt/container/serve-existing-mock
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=3)); raise SystemExit(payload.get('status') != 'ready')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 512

  frontend:
    image: epilepsy-qa-frontend:node20.11.0-nginx1.27.3
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker:
    <<: *backend-service
    profiles: ["ingestion"]
    command:
      - sh
      - -ec
      - |
        test -r /models/bge-m3/config.json || {
          echo >&2 "ingestion profile requires a readable BGE model mounted at /models/bge-m3";
          exit 64;
        }
        test -n "$(find /models/bge-m3 -maxdepth 1 -type f \( -name '*.safetensors' -o -name 'pytorch_model*.bin' \) -print -quit)" || {
          echo >&2 "BGE model weights were not found in /models/bge-m3";
          exit 64;
        }
        exec /opt/container/with-database-url python -m app.worker.main
    restart: "on-failure:3"
    environment:
      <<: *app-environment
      MOCK_MODE: "false"
      EMBED_MODEL_NAME: "${EMBED_MODEL_NAME:-BAAI/bge-m3}"
      EMBED_MODEL_PATH: "/models/bge-m3"
    volumes:
      - type: bind
        source: "${EMBED_MODEL_PATH:?Set EMBED_MODEL_PATH to an absolute host BGE model directory in config/compose.env.example}"
        target: /models/bge-m3
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s
    mem_limit: 6g
    cpus: "4.0"
    pids_limit: 1024

volumes:
  postgres_data:
  minio_data:
  qdrant_data:

networks:
  app:
    driver: bridge
