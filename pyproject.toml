[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epilepsy-qa-system"
version = "0.1.0"
description = "Epilepsy specialist QA and retrieval API"
requires-python = "==3.11.*"
dependencies = [
    "alembic==1.19.1",
    "anyio==4.15.0",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "minio==7.2.20",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "SQLAlchemy==2.0.52",
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
runtime = [
    "datasets==5.0.1",
    "FlagEmbedding==1.4.2",
    "langchain-core==1.6.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.2.0",
    "langgraph-sdk==0.4.4",
    "openai==2.54.0",
    "pdfplumber==0.11.10",
    "Pillow==12.3.0",
    "pymupdf==1.28.2",
    "pypdf==6.16.2",
    "pytesseract==0.3.13",
    "qdrant-client==1.19.0",
    "transformers==5.16.1",
]
dev = [
    "coverage[toml]==7.16.0",
    "httpx==0.28.1",
    "mypy==1.14.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "v2: V2-specific tests",
    "slow: slow-running tests",
    "integration: opt-in tests against real compose infrastructure",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.ruff]
required-version = "==0.8.4"
target-version = "py311"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
exclude = "(^|/)data/"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
