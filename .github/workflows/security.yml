name: Security

"on":
  pull_request:
  push:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  # Exact CLI pin; review and update this value deliberately.
  PIP_AUDIT_VERSION: "2.8.0"

jobs:
  python-audit:
    name: pip-audit (development and runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install pinned audit target and scanner
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0"
          python -m pip install --editable ".[dev,runtime]"
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          python -m pip check

      - name: Audit the installed Python environment
        run: python -m pip_audit --local --strict --vulnerability-service osv

  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 20.11.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify npm version
        run: test "$(npm --version)" = "10.2.4"

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Audit all npm dependencies
        run: npm audit --audit-level=high

  filesystem-and-secrets:
    name: Allowlisted filesystem and secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare a restricted-path-safe tracked-file scan root
        id: scan-root
        shell: bash
        run: |
          scan_root="${RUNNER_TEMP}/security-scan"
          rm -rf -- "${scan_root}"
          mkdir -p "${scan_root}"

          copied=0
          skipped=0
          while IFS= read -r -d '' path; do
            lower_path="${path,,}"
            case "${lower_path}" in
              .env|data|data/*|*/data|*/data/*|*.pdf|*benchmark*|*with_answers*|\
              *ground_truth*|*answer*.json|*answer*.jsonl)
                ((skipped += 1))
                continue
                ;;
            esac
            if [[ -L "${path}" ]]; then
              echo "::error::Refusing to stage tracked symlink: ${path}"
              exit 1
            fi
            if [[ ! -f "${path}" ]]; then
              continue
            fi
            install -D -m 0644 -- "${path}" "${scan_root}/${path}"
            ((copied += 1))
          done < <(git ls-files -z)

          if [[ "${copied}" -eq 0 ]]; then
            echo "::error::The restricted-path-safe scan root is empty."
            exit 1
          fi
          echo "Prepared ${copied} tracked files; excluded ${skipped} restricted files."
          # The scan root cannot contain root .env, data/, PDFs, answer artifacts, or benchmarks.
          echo "path=${scan_root}" >> "${GITHUB_OUTPUT}"

      # Pin the reviewed v0.28.0 release commit; Dependabot tracks updates.
      - name: Secret scan (Trivy secret scanner; Gitleaks equivalent)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ steps.scan-root.outputs.path }}
          scanners: secret
          format: table
          exit-code: "1"

      - name: Trivy filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ steps.scan-root.outputs.path }}
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
